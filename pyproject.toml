[project]
name = "sshpioner-tg-bot"
version = "0.3.0"
description = "Telegram assistant: downloads media from TikTok/Instagram/YouTube, generates and edits images, and chats — via any OpenAI-compatible API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.31",
    "aiohttp-socks>=0.8",
    "httpx[socks]>=0.27",
    "yt-dlp>=2026.8.19",
    "pydantic-settings>=2.5",
]

[project.scripts]
ttbot = "ttbot.app:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ttbot"]
